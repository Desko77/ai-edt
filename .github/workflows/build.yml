name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a branch be validated on Linux before it reaches main or a release tag.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      # The test fragment runs inside a real OSGi runtime and this bundle's Activator extends
      # AbstractUIPlugin, so org.eclipse.ui.workbench activates and SWT/GTK is loaded. On a runner
      # without an X display that can fail at Display creation, hence xvfb below. GTK itself is
      # normally present in the image; the fallbacks only cover package renames between releases.
      - name: Install headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0 || true

      - name: Maven build
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: xvfb-run -a mvn clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Test coverage census
        run: python3 scripts/test-coverage-audit.py --check

      # A catalog that drifts from the code is worse than no catalog: a stale section of it
      # once described a security hole the product did not have.
      # A facade's help is what an agent reads to find out what the facade can do. An
      # operation missing from it works and is never called - five had accumulated
      # before anyone counted.
      - name: Facade help census
        run: python3 scripts/check-facade-help.py

      # Which parameters an operation reads is known only to its handler, and a client is told about
      # all of a facade's on every request. Deriving the map from the sources is what makes hiding
      # the rest behind per-operation help possible at all; the check fails on an operation whose
      # parameters cannot be established, because publishing "none" for one of those would be a
      # claim rather than an answer.
      - name: Operation parameter census
        run: python3 scripts/check-operation-params.py --check

      - name: Tool catalog census
        run: python3 scripts/check-tool-catalog.py

      # A facade that delegates without asking whether a preset switched the tool off lets the whole
      # preset be walked around by calling the facade instead. It is structural, so it is counted
      # here rather than in the suite, which cannot read the sources from inside the OSGi runtime.
      - name: Facade gate census
        run: python3 scripts/check-facade-gates.py

      # A reflection failure caught and discarded looks exactly like "this EDT does not offer it".
      # getWorkspaceProject() was reached by name on a non-public implementation for years: invoke
      # refused it, the catch dropped it, and everything downstream degraded in silence. Each
      # swallow now has to say why absence is expected there.
      - name: Swallowed reflection census
        run: python3 scripts/check-swallowed-reflection.py

      # The README tells users to install the skill, so a skill that has fallen behind the code
      # teaches an agent that a capability is absent. That has happened twice: a removed facade left
      # described, and an import stated as refused months after it was built.
      - name: Skill coverage census
        run: python3 scripts/check-skill-coverage.py

      # Only the half of the EDT census that needs no network: a class or member reached by name
      # must be registered, or nothing will ever check it against a release. Whether it still exists
      # in each supported release is answered by the census workflow, which runs on the same push
      # and downloads EDT bundles - kept out of here so this build stays quick and offline.
      - name: EDT reflection registry
        run: python3 scripts/check-edt-api.py --registry-only

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: |
            mcp/tests/**/target/surefire-reports/*.xml

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'Bundle-Version:\s*\K[\d.]+' mcp/bundles/ru.aiedt.mcp.server/META-INF/MANIFEST.MF)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-EDT-${{ steps.version.outputs.version }}
          path: mcp/repositories/ru.aiedt.mcp.server.repository/target/repository/
