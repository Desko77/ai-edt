name: EDT API census

# Answers one question: does everything this plugin calls still exist in the 1C:EDT releases it
# claims to support. Nothing else in the build asks it - the compiler only ever sees the release in
# the target platform, so a member dropped by a later release fails at run time, on a user's
# machine, in whichever operation reached it.
#
# Its own workflow rather than a step in the build, deliberately. It is the one check here that
# talks to somebody else's website, and a failure to reach edt.1c.ru says nothing about the change
# being built. Kept apart, an outage reddens this and leaves the build alone, and the two signals
# stay readable.
#
# Runs on every push to main as well as weekly. Weekly answers "has 1C removed something since",
# which is the question that changes on their schedule. On push answers "does what we just wrote
# exist in the OTHER supported release" - a call present in the release we compile against and
# absent from another would otherwise sit in main until the next Monday.
#
# Measured on a runner 2026-08-16: edt.1c.ru answers, and a cold census of two releases takes about
# nine minutes, most of it downloading bundles. The bundle cache below is what keeps a warm run
# short; this is why the check is not in the ordinary build, which must stay quick and offline.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a release of EDT is noticed within days even when nothing is being committed.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      releases:
        description: "Releases to check against, space separated"
        required: false
        default: "2026.1 2026.2"

jobs:
  census:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      # The census reads the compiled classes, so they have to exist. Compiling alone is enough -
      # the test suite has its own workflow and needs a display, which this does not.
      - name: Compile
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: mvn compile --batch-mode --no-transfer-progress -T 1C

      # Bundles are large and unchanged between runs of the same release; downloading them once a
      # week rather than once a run is the difference between minutes and seconds.
      - name: Cache EDT bundles
        uses: actions/cache@v4
        with:
          path: .cache/edt-bundles
          key: edt-bundles-${{ github.event.inputs.releases || '2026.1 2026.2' }}
          restore-keys: edt-bundles-

      - name: Census
        run: |
          args=""
          for release in ${{ github.event.inputs.releases || '2026.1 2026.2' }}; do
            args="$args --against $release"
          done
          python3 scripts/check-edt-api.py $args --check
