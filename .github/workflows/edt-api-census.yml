name: EDT API census

# Answers one question: does everything this plugin calls still exist in the 1C:EDT releases it
# claims to support. Nothing else in the build asks it - the compiler only ever sees the release in
# the target platform, so a member dropped by a later release fails at run time, on a user's
# machine, in whichever operation reached it.
#
# On a schedule rather than on every push: the answer changes when 1C publishes a release, not when
# we commit, and each run downloads EDT bundles over the network. Paying that on every pull request
# would buy a repeated answer and tie every build to somebody else's website being up.
#
# The cost of that choice, stated rather than left to be discovered: a change that calls something
# present in the release we compile against but absent from another supported one is not caught
# until the next scheduled run - it can merge first. The ordinary build carries only the half that
# needs no network (is every name-reached class and member registered), so this is the half that
# lags. Moving it earlier is a decision waiting on one fact: whether edt.1c.ru answers from a GitHub
# runner at all. The first run of this workflow settles that, and this comment should be revisited
# with the answer.

on:
  schedule:
    # Weekly. A release of EDT is noticed within days, which is soon enough to act before anyone
    # upgrades into it.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      releases:
        description: "Releases to check against, space separated"
        required: false
        default: "2026.1 2026.2"

jobs:
  census:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      # The census reads the compiled classes, so they have to exist. Compiling alone is enough -
      # the test suite has its own workflow and needs a display, which this does not.
      - name: Compile
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: mvn compile --batch-mode --no-transfer-progress -T 1C

      # Bundles are large and unchanged between runs of the same release; downloading them once a
      # week rather than once a run is the difference between minutes and seconds.
      - name: Cache EDT bundles
        uses: actions/cache@v4
        with:
          path: .cache/edt-bundles
          key: edt-bundles-${{ github.event.inputs.releases || '2026.1 2026.2' }}
          restore-keys: edt-bundles-

      - name: Census
        run: |
          args=""
          for release in ${{ github.event.inputs.releases || '2026.1 2026.2' }}; do
            args="$args --against $release"
          done
          python3 scripts/check-edt-api.py $args --check
