name: Deploy Update Site

on:
  # A release created by a workflow using GITHUB_TOKEN does not raise the
  # release event - GitHub suppresses it to stop workflows triggering each
  # other. So the real trigger is the Release run finishing; the release
  # event stays for a release published by hand.
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Extract version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: use the latest published release tag
            VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName | ltrimstr("v")')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          gh release download "v${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "AI-EDT-*.zip" \
            --output release.zip
          unzip -q release.zip -d _site/

      - name: Create index.html
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>AI-EDT Update Site</title>
            <style>
              body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 42rem;
                     margin: 3rem auto; padding: 0 1rem; }
              code, pre { background: #f4f4f4; border-radius: 4px; }
              pre { padding: .75rem 1rem; overflow-x: auto; user-select: all; }
              code { padding: .1rem .3rem; }
              ul { padding-left: 1.2rem; }
              footer { margin-top: 2.5rem; font-size: .9rem; color: #555; }
              @media (prefers-color-scheme: dark) {
                body { background: #0d1117; color: #e6edf3; }
                code, pre { background: #161b22; }
                a { color: #58a6ff; }
                footer { color: #8b949e; }
              }
            </style>
          </head>
          <body>
            <h1>AI-EDT Update Site</h1>
            <p>MCP server for 1C:EDT, running as a plugin inside a live EDT instance.
               Current version: <strong>${VERSION}</strong>.</p>

            <h2>Install</h2>
            <p>In EDT open <strong>Help -&gt; Install New Software...</strong>, press
               <strong>Add</strong> and paste this address:</p>
            <pre>${SITE_URL}</pre>
            <p>Then pick the <strong>AI-EDT</strong> category and follow the wizard. The build is
               unsigned, so EDT asks you to confirm unsigned content once.</p>

            <h2>Other ways in</h2>
            <ul>
              <li><a href="${REPO_URL}#-3-install-into-edt">Ask an AI agent to install it</a> - one
                  message, no clicking.</li>
              <li><a href="${REPO_URL}/releases/latest">Latest release</a> - the same repository as a
                  ZIP, for offline installation through <strong>Add -&gt; Archive</strong>.</li>
              <li><a href="${REPO_URL}">Source, documentation and issue tracker</a>.</li>
            </ul>

            <footer>
              AI-EDT - 1C AI tools for EDT. Based on EDT-MCP by DitriX. AGPL-3.0-or-later.
            </footer>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
