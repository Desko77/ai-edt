name: E2E Tests

# These tests talk to a live MCP server inside a running EDT, so they need a runner that has EDT
# installed and a session open. A GitHub-hosted runner has neither, which is why this cannot simply
# be turned on for every push: it would fail every time and teach everyone to ignore it.
#
# So the trigger is wired and the job is gated on the repository variable E2E_RUNNER, which holds the
# label of a self-hosted runner. Set it and this becomes a real gate on pull requests and on main;
# leave it unset and the job is skipped rather than failed. Nothing here reports green without having
# run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      mcp_host:
        description: "MCP server host"
        required: false
        default: "localhost"
      mcp_port:
        description: "MCP server port"
        required: false
        default: "12250"
      project_name:
        description: "EDT project name for testing"
        required: false
        default: "AiEdtProbe"

env:
  MCP_HOST: ${{ github.event.inputs.mcp_host || 'localhost' }}
  MCP_PORT: ${{ github.event.inputs.mcp_port || '12250' }}
  MCP_PROJECT: ${{ github.event.inputs.project_name || 'AiEdtProbe' }}

jobs:
  e2e-test:
    if: vars.E2E_RUNNER != ''
    runs-on: ${{ vars.E2E_RUNNER }}
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for MCP server
        env:
          MCP_HOST: ${{ github.event.inputs.mcp_host }}
          MCP_PORT: ${{ github.event.inputs.mcp_port }}
        run: |
          echo "Checking MCP server at $MCP_HOST:$MCP_PORT ..."
          for i in $(seq 1 30); do
            if curl -sf "http://$MCP_HOST:$MCP_PORT/health" > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done
          echo "ERROR: MCP server not available"
          exit 1

      - name: Run E2E tests
        env:
          MCP_HOST: ${{ github.event.inputs.mcp_host }}
          MCP_PORT: ${{ github.event.inputs.mcp_port }}
          MCP_PROJECT: ${{ github.event.inputs.project_name }}
        run: |
          python tests/e2e/run_e2e_tests.py \
            --host "$MCP_HOST" \
            --port "$MCP_PORT" \
            --project "$MCP_PROJECT" \
            --junit-xml tests/e2e/e2e-results.xml

      - name: Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: tests/e2e/e2e-results.xml

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: tests/e2e/e2e-results.xml
