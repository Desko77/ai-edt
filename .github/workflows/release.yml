name: Release

on:
  push:
    tags:
      - 'v*'
  # A tag can only be built once by the push trigger, and a run that dies on infrastructure leaves
  # no way to build it again except deleting and re-pushing the tag - which rewrites a published
  # ref for a reason that has nothing to do with the code. This lets the same tag be rebuilt from
  # a fixed workflow instead.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.2.31'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a tag push this is the tag already; on a manual rebuild it is the tag named in the
          # input, so the artifact is built from the same source either way.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # tag: v1.26.0 -> 1.26.0
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        working-directory: mcp
        run: |
          mvn org.eclipse.tycho:tycho-versions-plugin:4.0.5:set-version \
            -DnewVersion=${{ steps.version.outputs.version }} \
            --batch-mode --no-transfer-progress

      # See the note in build.yml: the OSGi test runtime loads SWT/GTK, so give it a display.
      #
      # Bounded and non-fatal on purpose. The runner image already ships xvfb, so this step is
      # insurance, not a dependency - and on 2026-08-19 it stopped being free: the same commands
      # that took 11 seconds in the morning hung indefinitely twice in the afternoon, holding a
      # release that was otherwise ready. An unbounded apt call in a release path can stall the
      # release for as long as a mirror or a dpkg lock feels like it. Now it gets ten minutes and
      # the build proceeds either way; if xvfb really is absent, the Maven step fails on its own
      # and says so.
      - name: Install headless display
        continue-on-error: true
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update || true
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y xvfb || true
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y libgtk-3-0t64 \
            || sudo apt-get -o DPkg::Lock::Timeout=120 install -y libgtk-3-0 || true
          command -v xvfb-run || echo "xvfb-run not on PATH - the Maven step will say so"

      - name: Maven build
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: xvfb-run -a mvn clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Collect the distribution archive
        run: |
          cp mcp/repositories/ru.aiedt.mcp.server.repository/target/AI-EDT-${{ steps.version.outputs.version }}.zip \
             "$GITHUB_WORKSPACE/"
          # A second copy under a fixed name, so p2 can be pointed at
          # releases/latest/download/AI-EDT-update-site.zip and never go stale.
          cp "$GITHUB_WORKSPACE/AI-EDT-${{ steps.version.outputs.version }}.zip" \
             "$GITHUB_WORKSPACE/AI-EDT-update-site.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly rather than taken from the ref: on a manual rebuild the ref is a
          # branch, and the release has to land on the tag all the same.
          tag_name: ${{ steps.version.outputs.tag }}
          name: AI-EDT v${{ steps.version.outputs.version }}
          files: AI-EDT-*.zip
          generate_release_notes: true
